<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAMOTECH Email Signature Generator</title>
    <script defer src="https://umami.samoabiz.com/script.js" data-website-id="8ab8fffd-f9e7-48f7-aa90-0f8d3e5292d6"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyber-cyan: #00f3ff;
            --cyber-blue: #0ff;
            --cyber-dark: #0a0e27;
            --cyber-darker: #050814;
            --cyber-purple: #9d00ff;
            --cyber-pink: #ff00ff;
            --grid-color: rgba(0, 243, 255, 0.1);
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--cyber-darker);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Glow orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb-1 {
            width: 400px;
            height: 400px;
            background: var(--cyber-cyan);
            top: -200px;
            right: -200px;
            animation: float 15s ease-in-out infinite;
        }

        .glow-orb-2 {
            width: 300px;
            height: 300px;
            background: var(--cyber-purple);
            bottom: -150px;
            left: -150px;
            animation: float 20s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyber-cyan) 0%, var(--cyber-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--cyber-cyan), transparent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .subtitle {
            color: var(--cyber-cyan);
            font-size: 1.2rem;
            font-weight: 300;
            margin-top: 20px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel {
            background: rgba(10, 14, 39, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 243, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyber-cyan), transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--cyber-cyan);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title::before {
            content: '▶';
            color: var(--cyber-purple);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--cyber-cyan);
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: 'Exo 2', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="url"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--cyber-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(0, 243, 255, 0.1);
        }

        .color-picker-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .color-input-wrapper {
            position: relative;
        }

        input[type="color"] {
            width: 100%;
            height: 50px;
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            transition: all 0.3s ease;
        }

        input[type="color"]:hover {
            border-color: var(--cyber-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .color-label {
            position: absolute;
            bottom: -20px;
            left: 0;
            font-size: 0.75rem;
            color: rgba(0, 243, 255, 0.6);
        }

        .template-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .template-option {
            padding: 15px;
            background: rgba(0, 243, 255, 0.05);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .template-option:hover {
            border-color: var(--cyber-cyan);
            background: rgba(0, 243, 255, 0.1);
            transform: translateY(-2px);
        }

        .template-option.active {
            border-color: var(--cyber-cyan);
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .preview-area {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            min-height: 300px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 15px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyber-cyan) 0%, var(--cyber-blue) 100%);
            color: var(--cyber-dark);
            box-shadow: 0 5px 20px rgba(0, 243, 255, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 30px rgba(0, 243, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--cyber-purple) 0%, var(--cyber-pink) 100%);
            color: #fff;
            box-shadow: 0 5px 20px rgba(157, 0, 255, 0.4);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 30px rgba(157, 0, 255, 0.6);
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 243, 255, 0.95);
            color: var(--cyber-dark);
            padding: 20px 30px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            box-shadow: 0 10px 40px rgba(0, 243, 255, 0.5);
            transform: translateX(400px);
            transition: transform 0.5s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        /* Signature Styles */
        .email-signature {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .sig-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sig-title {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .sig-company {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .sig-divider {
            height: 2px;
            margin: 10px 0;
        }

        .sig-contact {
            font-size: 13px;
            margin: 3px 0;
        }

        .sig-social {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .sig-social a {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .sig-logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 10px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }

            .template-select {
                grid-template-columns: 1fr;
            }

            .color-picker-group {
                grid-template-columns: 1fr;
            }
        }

        .code-viewer {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .code-viewer pre {
            color: var(--cyber-cyan);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .code-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyber-cyan);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="container">
        <header>
            <h1>Email Signature Generator</h1>
            <p class="subtitle">Powered by HAMOTECH Solutions</p>
        </header>

        <div class="main-content">
            <!-- Form Panel -->
            <div class="panel">
                <h2 class="panel-title">Signature Details</h2>
                
                <div class="form-group">
                    <label>Template Style</label>
                    <div class="template-select">
                        <div class="template-option active" data-template="modern">Modern</div>
                        <div class="template-option" data-template="classic">Classic</div>
                        <div class="template-option" data-template="minimal">Minimal</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Richard Vaalotu">
                </div>

                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle" placeholder="Founder & CEO">
                </div>

                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="companyName" placeholder="HAMOTECH Solutions">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="richard@hamotechsolutions.com">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="+685 123 4567">
                </div>

                <div class="form-group">
                    <label>Website</label>
                    <input type="url" id="website" placeholder="https://hamotechsolutions.com">
                </div>

                <div class="form-group">
                    <label>Address (Optional)</label>
                    <input type="text" id="address" placeholder="Apia, Samoa">
                </div>

                <div class="form-group">
                    <label>Logo URL (Optional)</label>
                    <input type="url" id="logoUrl" placeholder="https://example.com/logo.png">
                </div>

                <div class="form-group">
                    <label>Color Scheme</label>
                    <div class="color-picker-group">
                        <div class="color-input-wrapper">
                            <input type="color" id="primaryColor" value="#00f3ff">
                            <span class="color-label">Primary</span>
                        </div>
                        <div class="color-input-wrapper">
                            <input type="color" id="textColor" value="#333333">
                            <span class="color-label">Text</span>
                        </div>
                        <div class="color-input-wrapper">
                            <input type="color" id="accentColor" value="#9d00ff">
                            <span class="color-label">Accent</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Social Media (Optional)</label>
                    <input type="url" id="linkedin" placeholder="LinkedIn URL" style="margin-bottom: 10px;">
                    <input type="url" id="twitter" placeholder="Twitter/X URL" style="margin-bottom: 10px;">
                    <input type="url" id="facebook" placeholder="Facebook URL">
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="panel">
                <h2 class="panel-title">Live Preview</h2>
                
                <div class="preview-area" id="previewArea">
                    <div class="email-signature" id="signaturePreview">
                        <!-- Signature will be generated here -->
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="copySignature()">
                        <span>📋 Copy Signature</span>
                    </button>
                    <button class="btn btn-secondary" onclick="copyHTML()">
                        <span>💻 Copy HTML</span>
                    </button>
                </div>

                <div class="code-viewer">
                    <div class="code-header">
                        <span class="code-title">HTML Code</span>
                        <button class="btn btn-primary btn-small" onclick="copyHTML()">
                            <span>Copy Code</span>
                        </button>
                    </div>
                    <pre id="htmlCode"></pre>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        // Template selection
        const templateOptions = document.querySelectorAll('.template-option');
        let currentTemplate = 'modern';

        templateOptions.forEach(option => {
            option.addEventListener('click', function() {
                templateOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                currentTemplate = this.dataset.template;
                updateSignature();
            });
        });

        // Form inputs
        const inputs = {
            fullName: document.getElementById('fullName'),
            jobTitle: document.getElementById('jobTitle'),
            companyName: document.getElementById('companyName'),
            email: document.getElementById('email'),
            phone: document.getElementById('phone'),
            website: document.getElementById('website'),
            address: document.getElementById('address'),
            logoUrl: document.getElementById('logoUrl'),
            primaryColor: document.getElementById('primaryColor'),
            textColor: document.getElementById('textColor'),
            accentColor: document.getElementById('accentColor'),
            linkedin: document.getElementById('linkedin'),
            twitter: document.getElementById('twitter'),
            facebook: document.getElementById('facebook')
        };

        // Add event listeners to all inputs
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updateSignature);
        });

        function updateSignature() {
            const data = {
                fullName: inputs.fullName.value || 'Your Name',
                jobTitle: inputs.jobTitle.value || 'Your Title',
                companyName: inputs.companyName.value || 'Company Name',
                email: inputs.email.value,
                phone: inputs.phone.value,
                website: inputs.website.value,
                address: inputs.address.value,
                logoUrl: inputs.logoUrl.value,
                primaryColor: inputs.primaryColor.value,
                textColor: inputs.textColor.value,
                accentColor: inputs.accentColor.value,
                linkedin: inputs.linkedin.value,
                twitter: inputs.twitter.value,
                facebook: inputs.facebook.value
            };

            let signatureHTML = '';

            if (currentTemplate === 'modern') {
                signatureHTML = generateModernSignature(data);
            } else if (currentTemplate === 'classic') {
                signatureHTML = generateClassicSignature(data);
            } else if (currentTemplate === 'minimal') {
                signatureHTML = generateMinimalSignature(data);
            }

            document.getElementById('signaturePreview').innerHTML = signatureHTML;
            document.getElementById('htmlCode').textContent = signatureHTML;
        }

        function generateModernSignature(data) {
            const socialIcons = generateSocialIcons(data);
            const logo = data.logoUrl ? `<img src="${data.logoUrl}" alt="Logo" class="sig-logo" style="max-width: 150px; height: auto; margin-bottom: 10px;">` : '';
            
            return `<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, sans-serif; line-height: 1.6; color: ${data.textColor};">
    <tr>
        <td style="padding-right: 20px; border-right: 3px solid ${data.primaryColor}; vertical-align: top;">
            ${logo}
        </td>
        <td style="padding-left: 20px; vertical-align: top;">
            <div style="font-size: 18px; font-weight: bold; color: ${data.primaryColor}; margin-bottom: 5px;">${data.fullName}</div>
            <div style="font-size: 14px; color: ${data.accentColor}; margin-bottom: 5px;">${data.jobTitle}</div>
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px;">${data.companyName}</div>
            ${data.email ? `<div style="font-size: 13px; margin: 3px 0;">📧 <a href="mailto:${data.email}" style="color: ${data.textColor}; text-decoration: none;">${data.email}</a></div>` : ''}
            ${data.phone ? `<div style="font-size: 13px; margin: 3px 0;">📱 ${data.phone}</div>` : ''}
            ${data.website ? `<div style="font-size: 13px; margin: 3px 0;">🌐 <a href="${data.website}" style="color: ${data.primaryColor}; text-decoration: none;">${data.website}</a></div>` : ''}
            ${data.address ? `<div style="font-size: 13px; margin: 3px 0;">📍 ${data.address}</div>` : ''}
            ${socialIcons}
        </td>
    </tr>
</table>`;
        }

        function generateClassicSignature(data) {
            const socialIcons = generateSocialIcons(data);
            const logo = data.logoUrl ? `<img src="${data.logoUrl}" alt="Logo" class="sig-logo" style="max-width: 150px; height: auto; margin-bottom: 10px;">` : '';
            
            return `<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, sans-serif; line-height: 1.6; color: ${data.textColor};">
    <tr>
        <td>
            ${logo}
            <div style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">${data.fullName}</div>
            <div style="font-size: 14px; margin-bottom: 5px;">${data.jobTitle}</div>
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px;">${data.companyName}</div>
            <div style="height: 2px; background-color: ${data.primaryColor}; margin: 10px 0; width: 200px;"></div>
            ${data.email ? `<div style="font-size: 13px; margin: 3px 0;">Email: <a href="mailto:${data.email}" style="color: ${data.textColor}; text-decoration: none;">${data.email}</a></div>` : ''}
            ${data.phone ? `<div style="font-size: 13px; margin: 3px 0;">Phone: ${data.phone}</div>` : ''}
            ${data.website ? `<div style="font-size: 13px; margin: 3px 0;">Web: <a href="${data.website}" style="color: ${data.primaryColor}; text-decoration: none;">${data.website}</a></div>` : ''}
            ${data.address ? `<div style="font-size: 13px; margin: 3px 0;">Address: ${data.address}</div>` : ''}
            ${socialIcons}
        </td>
    </tr>
</table>`;
        }

        function generateMinimalSignature(data) {
            const socialIcons = generateSocialIcons(data);
            
            return `<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, sans-serif; line-height: 1.8; color: ${data.textColor};">
    <tr>
        <td>
            <div style="font-size: 16px; font-weight: bold; color: ${data.primaryColor};">${data.fullName}</div>
            <div style="font-size: 13px; color: ${data.textColor};">${data.jobTitle} | ${data.companyName}</div>
            <div style="font-size: 13px; margin-top: 8px;">
                ${data.email ? `<a href="mailto:${data.email}" style="color: ${data.textColor}; text-decoration: none; margin-right: 10px;">${data.email}</a>` : ''}
                ${data.phone ? `<span style="margin-right: 10px;">${data.phone}</span>` : ''}
                ${data.website ? `<a href="${data.website}" style="color: ${data.primaryColor}; text-decoration: none;">${data.website}</a>` : ''}
            </div>
            ${socialIcons}
        </td>
    </tr>
</table>`;
        }

        function generateSocialIcons(data) {
            if (!data.linkedin && !data.twitter && !data.facebook) return '';
            
            let icons = '<div style="margin-top: 10px;">';
            
            if (data.linkedin) {
                icons += `<a href="${data.linkedin}" style="margin-right: 8px; display: inline-block;"><img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" width="20" height="20" style="vertical-align: middle;"></a>`;
            }
            if (data.twitter) {
                icons += `<a href="${data.twitter}" style="margin-right: 8px; display: inline-block;"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" width="20" height="20" style="vertical-align: middle;"></a>`;
            }
            if (data.facebook) {
                icons += `<a href="${data.facebook}" style="margin-right: 8px; display: inline-block;"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" width="20" height="20" style="vertical-align: middle;"></a>`;
            }
            
            icons += '</div>';
            return icons;
        }

        function copySignature() {
            const signature = document.getElementById('signaturePreview');
            const range = document.createRange();
            range.selectNode(signature);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            
            try {
                document.execCommand('copy');
                showToast('Signature copied! Paste it into your email client.');
            } catch (err) {
                showToast('Failed to copy. Please try copying the HTML code instead.');
            }
            
            window.getSelection().removeAllRanges();
        }

        function copyHTML() {
            const htmlCode = document.getElementById('htmlCode').textContent;
            navigator.clipboard.writeText(htmlCode).then(() => {
                showToast('HTML code copied to clipboard!');
            }).catch(err => {
                showToast('Failed to copy HTML code.');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize with default signature
        updateSignature();
    </script>
